name: Fetch Leaderboard

on:
  schedule:
    # 9pm ET = 1am UTC (Thu-Sun during golf season)
    - cron: '0 1 * * 5'   # Friday 1am UTC = Thursday 9pm ET
    - cron: '0 1 * * 6'   # Saturday 1am UTC = Friday 9pm ET
    - cron: '0 1 * * 0'   # Sunday 1am UTC = Saturday 9pm ET
    - cron: '0 1 * * 1'   # Monday 1am UTC = Sunday 9pm ET
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch leaderboard from ESPN
        run: python3 fetch_leaderboard.py

      - name: Commit and push leaderboard.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/leaderboard.json
          git diff --staged --quiet || git commit -m "Update leaderboard $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
